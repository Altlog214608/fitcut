<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KoiCut</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101215" media="(prefers-color-scheme: dark)" />
    <!-- adsense: 배포 빌드(VITE_ADS=on)에서만 AdSense 코드로 바뀐다 (vite.config.ts, ADR-052) -->
    <script>
      // 고른 테마를 그리기 전에 적용한다 (깜빡임 방지). lib/theme.ts와 같은 키
      try {
        var t = localStorage.getItem('fitcut.theme');
        if (t === '"light"' || t === '"dark"')
          document.documentElement.dataset.theme = JSON.parse(t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
