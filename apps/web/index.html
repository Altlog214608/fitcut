<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KoiCut</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101215" media="(prefers-color-scheme: dark)" />
    <!-- Google AdSense (ADR-052). 광고 자리는 components/AdSlot.tsx, 자동 광고는 AdSense 화면에서 끈다 -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5555123248227301"
      crossorigin="anonymous"
    ></script>
    <script>
      // 고른 테마를 그리기 전에 적용한다 (깜빡임 방지). lib/theme.ts와 같은 키
      try {
        var t = localStorage.getItem('fitcut.theme');
        if (t === '"light"' || t === '"dark"')
          document.documentElement.dataset.theme = JSON.parse(t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
