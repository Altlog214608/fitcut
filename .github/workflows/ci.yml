name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.16.5
  AWS_REGION: ap-northeast-2

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: E2E (Playwright, Chromium 데스크톱·모바일)
        run: |
          pnpm --filter @fitcut/web exec playwright install --with-deps chromium webkit
          pnpm --filter @fitcut/web e2e
      - name: E2E 결과 올리기 (실패했을 때만)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7

  # 실제 워커 이미지(arm64, Lambda와 같은 아키텍처)를 만들고, 이미지 속 ffmpeg로 구간 정확도 시험을 돌린다
  worker-image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fitcut/worker build
      - name: 이미지 빌드
        working-directory: services/worker
        run: docker build -t fitcut-worker:ci .
      - name: 이미지 속 ffmpeg로 시험
        run: |
          id=$(docker create fitcut-worker:ci)
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          docker cp "$id:/opt/bin/ffmpeg" "$RUNNER_TEMP/ffmpeg/ffmpeg"
          docker cp "$id:/opt/bin/ffprobe" "$RUNNER_TEMP/ffmpeg/ffprobe"
          docker rm "$id"
          "$RUNNER_TEMP/ffmpeg/ffmpeg" -hide_banner -version | head -1
          FFMPEG_PATH="$RUNNER_TEMP/ffmpeg/ffmpeg" FFPROBE_PATH="$RUNNER_TEMP/ffmpeg/ffprobe" \
            pnpm --filter @fitcut/worker test
      - name: 이미지 크기
        run: |
          size=$(docker image ls fitcut-worker:ci --format '{{.Size}}')
          echo "워커 이미지 크기 - $size" >> "$GITHUB_STEP_SUMMARY"

  terraform:
    runs-on: ubuntu-latest
    # 포크에서 온 PR은 OIDC 토큰을 받을 수 없으므로 plan을 돌리지 않는다.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Lambda 코드 묶음(zip 해시)이 plan에 들어가므로 먼저 만든다
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fitcut/api build
      - run: pnpm --filter @fitcut/events build
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive infra/terraform

      - name: terraform validate (bootstrap)
        working-directory: infra/terraform/bootstrap
        run: terraform init -backend=false -input=false && terraform validate

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: terraform plan (dev)
        working-directory: infra/terraform/envs/dev
        run: |
          terraform init -input=false
          terraform validate
          terraform plan -input=false -lock-timeout=5m -no-color -out=tfplan \
            -var "worker_image_tag=$(sh ../../../../scripts/worker-image-tag.sh)"
          {
            echo '## terraform plan (dev)'
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
