name: Deploy

# main에 머지되면 dev 인프라를 적용하고 웹을 배포한다. PR에서 plan을 확인한 뒤 머지하는 것이 적용 요청이다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  TF_VERSION: 1.16.5
  AWS_REGION: ap-northeast-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fitcut/web build

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: terraform apply (dev)
        id: tf
        working-directory: infra/terraform/envs/dev
        run: |
          terraform init -input=false
          terraform apply -input=false -lock-timeout=5m -auto-approve -no-color
          echo "bucket=$(terraform output -raw web_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(terraform output -raw web_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "url=$(terraform output -raw web_url)" >> "$GITHUB_OUTPUT"

      # 1) 해시가 붙은 assets를 먼저 올린다 (1년 캐시). 이전 assets는 지우지 않아
      #    아직 이전 index.html을 가진 브라우저도 깨지지 않는다.
      # 2) 나머지(index.html 등)는 no-cache로 올리고, 빌드에 없는 파일은 지운다.
      # 3) index.html만 캐시를 무효화한다 (SPA 경로는 모두 /index.html로 바뀌어 캐시된다).
      - name: Upload web
        env:
          BUCKET: ${{ steps.tf.outputs.bucket }}
          DISTRIBUTION_ID: ${{ steps.tf.outputs.distribution_id }}
        run: |
          aws s3 sync apps/web/dist/assets "s3://$BUCKET/assets" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync apps/web/dist "s3://$BUCKET" --delete --exclude "assets/*" \
            --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths "/index.html" > /dev/null

      - name: Summary
        env:
          URL: ${{ steps.tf.outputs.url }}
        run: echo "배포 완료 - $URL" >> "$GITHUB_STEP_SUMMARY"
