name: Deploy

# main에 머지되면 dev 인프라를 적용하고 웹을 배포한다. PR에서 plan을 확인한 뒤 머지하는 것이 적용 요청이다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  TF_VERSION: 1.16.5
  AWS_REGION: ap-northeast-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fitcut/web build
        env:
          # 사용 이벤트의 appVersion (lib/analytics.ts)
          VITE_APP_VERSION: ${{ github.sha }}
          # AdSense 코드와 광고 자리 (ADR-052). 배포 빌드에서만 켠다
          VITE_ADS: 'on'
      - run: pnpm --filter @fitcut/api build
      - run: pnpm --filter @fitcut/events build
      - run: pnpm --filter @fitcut/admin build
      - run: pnpm --filter @fitcut/highlight build
      - run: pnpm --filter @fitcut/worker build
      - run: pnpm --filter @fitcut/collector build

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      # 워커 이미지: 저장소를 먼저 만들고(처음 한 번), 같은 태그 이미지가 없을 때만 arm64로 빌드해 올린다.
      # 태그는 services/worker와 잠금 파일 내용으로 정해져서, 워커를 바꾸지 않으면 다시 만들지 않는다.
      - name: 워커 이미지
        id: image
        working-directory: infra/terraform/envs/dev
        run: |
          tag=$(sh ../../../../scripts/worker-image-tag.sh)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          terraform init -input=false
          terraform apply -input=false -lock-timeout=5m -auto-approve -no-color \
            -target=module.worker.aws_ecr_repository.worker -var "worker_image_tag=$tag" \
            -var "collector_image_tag=$(sh ../../../../scripts/collector-image-tag.sh)"
          repo=$(terraform output -raw worker_repository_url 2>/dev/null || true)
          if [ -z "$repo" ]; then
            repo=$(aws ecr describe-repositories --repository-names fitcut-dev-worker --query 'repositories[0].repositoryUri' --output text)
          fi
          if aws ecr describe-images --repository-name fitcut-dev-worker --image-ids "imageTag=$tag" >/dev/null 2>&1; then
            echo "이미지 $tag 이미 있음"
            exit 0
          fi
          aws ecr get-login-password | docker login --username AWS --password-stdin "${repo%%/*}"
          docker run --privileged --rm tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install arm64
          docker buildx build --platform linux/arm64 --provenance=false -t "$repo:$tag" --push ../../../../services/worker

      # 수집기 이미지 (M5): 워커와 같은 방식. 태그는 services/collector·packages/chzzk·잠금 파일 내용으로 정해진다
      - name: 수집기 이미지
        id: collector
        working-directory: infra/terraform/envs/dev
        env:
          WORKER_TAG: ${{ steps.image.outputs.tag }}
        run: |
          tag=$(sh ../../../../scripts/collector-image-tag.sh)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          terraform apply -input=false -lock-timeout=5m -auto-approve -no-color \
            -target=module.collector.aws_ecr_repository.collector \
            -var "worker_image_tag=$WORKER_TAG" -var "collector_image_tag=$tag"
          repo=$(aws ecr describe-repositories --repository-names fitcut-dev-collector --query 'repositories[0].repositoryUri' --output text)
          if aws ecr describe-images --repository-name fitcut-dev-collector --image-ids "imageTag=$tag" >/dev/null 2>&1; then
            echo "이미지 $tag 이미 있음"
            exit 0
          fi
          aws ecr get-login-password | docker login --username AWS --password-stdin "${repo%%/*}"
          docker run --privileged --rm tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install arm64
          docker buildx build --platform linux/arm64 --provenance=false -t "$repo:$tag" --push ../../../../services/collector

      - name: terraform apply (dev)
        id: tf
        working-directory: infra/terraform/envs/dev
        env:
          TAG: ${{ steps.image.outputs.tag }}
          COLLECTOR_TAG: ${{ steps.collector.outputs.tag }}
        run: |
          terraform apply -input=false -lock-timeout=5m -auto-approve -no-color -var "worker_image_tag=$TAG" -var "collector_image_tag=$COLLECTOR_TAG"
          echo "bucket=$(terraform output -raw web_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(terraform output -raw web_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "url=$(terraform output -raw web_url)" >> "$GITHUB_OUTPUT"
          # 관리자 로그인 설정 (비밀이 아님). 웹 빌드는 apply 전에 끝나서 실행 중에 읽는 파일로 둔다
          pool="$(terraform output -raw admin_user_pool_id)"
          client="$(terraform output -raw admin_client_id)"
          echo "{\"region\":\"ap-northeast-2\",\"userPoolId\":\"$pool\",\"clientId\":\"$client\"}" \
            > ../../../../apps/web/dist/admin-config.json

      # 1) 해시가 붙은 assets를 먼저 올린다 (1년 캐시). 이전 assets는 지우지 않아
      #    아직 이전 index.html을 가진 브라우저도 깨지지 않는다.
      # 2) 나머지(index.html 등)는 no-cache로 올리고, 빌드에 없는 파일은 지운다.
      # 3) index.html만 캐시를 무효화한다 (SPA 경로는 모두 /index.html로 바뀌어 캐시된다).
      - name: Upload web
        env:
          BUCKET: ${{ steps.tf.outputs.bucket }}
          DISTRIBUTION_ID: ${{ steps.tf.outputs.distribution_id }}
        run: |
          aws s3 sync apps/web/dist/assets "s3://$BUCKET/assets" \
            --cache-control "public,max-age=31536000,immutable"
          # AI 업스케일 모델(F20): 이름이 바뀌지 않아 1주일만 캐시한다 (바꿀 때는 파일 이름을 바꾼다)
          aws s3 sync apps/web/dist/models "s3://$BUCKET/models" --delete \
            --cache-control "public,max-age=604800"
          aws s3 sync apps/web/dist "s3://$BUCKET" --delete --exclude "assets/*" --exclude "models/*" \
            --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths "/index.html" > /dev/null

      - name: Summary
        env:
          URL: ${{ steps.tf.outputs.url }}
        run: echo "배포 완료 - $URL" >> "$GITHUB_STEP_SUMMARY"
